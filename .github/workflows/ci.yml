# CI (TICKET-928). Every pull request and every push to main runs the checks the tech
# stack promised for stage 0 (docs/architecture/tech-stack.md, CI row): the import
# boundary, ruff, and the whole test suite. Branch protection on main requires this
# job ("CI / checks") to pass before a PR can merge.
#
# One job on purpose, so branch protection has one check to require. The boundary step
# runs first and needs nothing installed, so a Rule 5 breach fails in seconds.

name: CI

on:
  pull_request:
  push:
    branches: [main]

# A newer push to the same PR or branch cancels the run it replaces.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    name: checks
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      UV_FROZEN: "1" # never re-lock in CI: install exactly what uv.lock says
    steps:
      - uses: actions/checkout@v4
        with:
          # TICKET-990: the release-path test pins shas in this repo's history
          fetch-depth: 0

      # Methodology Rule 5: production (and shared) code must not import research.
      # TD-008's import-boundary job, unblocked now that more than one engineer merges.
      - name: Import boundary (production and shared must not import research)
        run: |
          if grep -rnE '^\s*(from|import) services\.research' services/production services/shared; then
            echo "::error::services/production or services/shared imports services.research (methodology Rule 5)"
            exit 1
          fi
          echo "boundary clean"

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Set up Python (from .python-version)
        run: uv python install

      # Default groups are dev + research (pyproject [tool.uv]), so this installs the
      # research stack too: tests/unit/engine, evaluation, models and
      # test_sold_trades_accounted.py need scipy and pymc. The server still installs
      # with --no-group research; this is the test environment, not the server's.
      - name: Install (uv sync --frozen)
        run: uv sync --frozen

      - name: Ruff
        run: uv run ruff check .

      # Everything but the research fits, no -x: a red run lists every failure, not the
      # first. Parallel by default (addopts -n auto, TICKET-1057); no -n here. No -q either: the addopts in pyproject has it, and -qq would drop the line
      # that counts the results. The fits run in research-fits below (TICKET-954).
      - name: Tests
        run: uv run pytest tests -m "not research_fit"

  # Not required, and it must never fail the workflow: these are the marginal M1 fits of
  # TICKET-897. Their result is a reading, not a gate, until 897 and the reference
  # environment (TICKET-975) are settled. Then this job becomes required again.
  research-fits:
    name: research-fits
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    continue-on-error: true
    env:
      UV_FROZEN: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          # TICKET-990: the release-path test pins shas in this repo's history
          fetch-depth: 0

      # The RCA could not prove what differed between runs and settled on the runner CPU
      # as most likely, unproven until the logs print it. This prints it.
      - name: Runner CPU
        run: lscpu

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Set up Python (from .python-version)
        run: uv python install

      - name: Install (uv sync --frozen)
        run: uv sync --frozen

      # One core: the MCMC fits are the platform-sensitive reading (TICKET-897); do not
      # change what they run on in the same change that speeds the rest (TICKET-1057).
      - name: Research fits
        run: uv run pytest -n 0 tests -m research_fit
