<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>What you risk · PlusEV Scope</title>
<link rel="icon" href="/static/icons/favicon.svg" type="image/svg+xml">
<link rel="icon" href="/static/icons/favicon-32.png" sizes="32x32" type="image/png">
<link rel="icon" href="/static/icons/favicon-16.png" sizes="16x16" type="image/png">
<link rel="apple-touch-icon" href="/static/icons/app-icon-180.png">
<link rel="stylesheet" href="/static/css/tokens.css">
<link rel="stylesheet" href="/static/css/components.css">
<link rel="stylesheet" href="/static/css/motion.css">
<script src="/static/js/htmx.min.js" defer></script>
</head>
<!--
  Screen: 13 · What you risk (one number)
  Route:  GET /risk · POST /risk
  
-->
<body>
<svg class="visually-hidden" aria-hidden="true" focusable="false"><defs><pattern id="hatch-light" width="5" height="5" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="5" height="5" fill="#FFFFFF"/><path d="M0 0V5" stroke="#DDE4F1" stroke-width="2"/></pattern></defs></svg>
<div class="screen">
<main class="screen__body">
  <p class="label label--plain">Your account</p>
  <h1 class="title">What you risk</h1>
  <p class="lead">How much are you willing to lose on a single trade?</p>
  <form method="post" action="/risk">
    <label class="field"><span class="field__label">Your number</span><input class="field__input field__input--mono" name="risk_value" inputmode="decimal" value="{{ form.risk_value }}"></label>
    <fieldset class="fieldset"><legend class="fieldset__legend">In</legend>
      <label class="choice"><input class="choice__input" type="radio" name="risk_unit" value="rupees"{% if form.risk_unit != 'percent' %} checked{% endif %}><span class="body">rupees</span></label>
      <label class="choice"><input class="choice__input" type="radio" name="risk_unit" value="percent"{% if form.risk_unit == 'percent' %} checked{% endif %}><span class="body">per cent of my trading capital</span></label>
    </fieldset>
    <label class="field"><span class="field__label">Your trading capital, in rupees</span><input class="field__input field__input--mono" name="capital" inputmode="decimal" value="{{ form.capital }}"><span class="field__hint">Only needed if you answered in per cent.</span></label>
    <label class="field"><span class="field__label">Has that been your number for the whole history you uploaded? If it changed, from when?</span><input class="field__input field__input--mono" type="date" name="since" value="{{ form.since }}"><span class="field__hint">Trades before this date keep whatever number was in force then. Set an earlier date if this has been your number all along.</span></label>
    <div class="screen__actions">
      <button class="btn btn--primary btn--block" type="submit">Record it</button>
      <a class="btn btn--text" href="/eligibility">Next: what we can and cannot check on your history</a>
    </div>
  </form>
</main>
</div>
</body>
</html>
