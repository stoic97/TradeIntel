<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>What we read · PlusEV Scope</title>
<link rel="icon" href="/static/icons/favicon.svg" type="image/svg+xml">
<link rel="icon" href="/static/icons/favicon-32.png" sizes="32x32" type="image/png">
<link rel="icon" href="/static/icons/favicon-16.png" sizes="16x16" type="image/png">
<link rel="apple-touch-icon" href="/static/icons/app-icon-180.png">
<link rel="stylesheet" href="/static/css/tokens.css">
<link rel="stylesheet" href="/static/css/components.css">
<link rel="stylesheet" href="/static/css/motion.css">
<script src="/static/js/htmx.min.js" defer></script>
</head>
<!--
  Screen: 7b · What we read · not a tradebook
  Route:  GET /imports/{id}  (rejected)
  
-->
<body>
<svg class="visually-hidden" aria-hidden="true" focusable="false"><defs><pattern id="hatch-light" width="5" height="5" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="5" height="5" fill="#FFFFFF"/><path d="M0 0V5" stroke="#DDE4F1" stroke-width="2"/></pattern></defs></svg>
<div class="screen">
<main class="screen__body">
  <p class="label label--plain">Your upload</p>
  <h1 class="title">What we read</h1>
  <p class="lead file-error">{{ import.rejection_text }}</p>
  <a class="btn btn--text" href="/upload">Upload a different file</a>
  <dl class="facts-list">
    <dt>Rows in the file</dt><dd>{{ import.rows_total }}</dd>
    <dt>Rows we could read</dt><dd>{{ import.rows_read }}</dd>
    <dt>Rows set aside</dt><dd>{{ import.rows_set_aside }}</dd>
    <dt>Trades reconstructed</dt><dd>{{ import.trades_reconstructed }}</dd>
  </dl>
</main>
</div>
</body>
</html>
