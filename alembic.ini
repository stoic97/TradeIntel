# Alembic for the Scope product schema. The app and the tests both drive migrations
# through services.production.db.session.run_migrations, which passes a live engine
# in config.attributes, so no database URL is configured here.
[alembic]
script_location = migrations
prepend_sys_path = .

[loggers]
keys = root

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
