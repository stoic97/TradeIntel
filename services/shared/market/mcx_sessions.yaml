# MCX sessions that are not a full weekday session, for the crude series' session check (TICKET-893).
#
# Kinds:
#   closed        no session at all on a weekday
#   evening_only  morning session closed for an Indian holiday, evening session (from 17:00 IST) open
#   morning_only  evening session closed, usually for a holiday in the overseas markets
#   special       a session on a weekend or at an unusual hour, such as Diwali muhurat trading
#
# Source: MCX's holiday list for 2026 (circular MCX/TRD/636/2025, 15 Dec 2025, as reproduced by
# brokers), checked against the bars: every entry below up to 12 Nov 2026 matches what the series
# shows on that day. A date not seen yet is listed only when the exchange closes on it every year.
# A session the series shows that is missing here makes the extension refuse, so add the line, with
# its reason, rather than loosening the check.

sessions:
  - {day: 2025-12-25, kind: closed, reason: Christmas}
