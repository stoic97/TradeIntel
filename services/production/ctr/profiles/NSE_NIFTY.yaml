  - {units: "25", from: "2024-04-26", until: "2024-12-31"}     # ~ 50 -> 25, 2024
  - {units: "75", from: "2024-11-20", until: "2026-01-31"}     # SEBI min contract value, 20 Nov 2024
  - {units: "65", from: "2025-12-29"}                          # ~ first seen 29 Dec 2025
