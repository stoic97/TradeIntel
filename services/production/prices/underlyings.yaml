# Which underlying's 1-minute series measures a trade, by instrument (TICKET-889).
#
# Data, versioned, and recorded on use: an import must be able to say which mapping produced its
# figures (PRD section 9 applies the same rule to instrument profiles). Change a mapping by raising
# "version". Add an underlying with an entry here and its folder of day files under SCOPE_MARKET_DIR
# (data/market by default): no code changes.
#
# profiles: "EXCHANGE:SYMBOL" as in ctr/profiles/*.yaml. One series per underlying, so an option
# and its mini share one: crude with crude mini, gold with gold mini (spec 4.7.3).
# folder: the underlying's folder under SCOPE_MARKET_DIR (TICKET-997): one gzip file per trading day,
# <folder>/<YYYY>/<YYYY-MM-DD>.csv.gz, and <folder>/manifest.json. Written only through
# services/shared/market/day_store.py; scripts/split_series_by_day.py turns an old single file into one.
# synthetic: generated in code from a seed, for test fixtures only; never a real instrument.
version: "2"
underlyings:
  NIFTY: {profiles: ["NSE:NIFTY"], folder: NIFTY}
  BANKNIFTY: {profiles: ["NSE:BANKNIFTY"], folder: BANKNIFTY}
  SENSEX: {profiles: ["BSE:SENSEX"], folder: SENSEX}
  CRUDEOIL: {profiles: ["MCX:CRUDEOIL", "MCX:CRUDEOILM"], folder: CRUDEOIL}
  GOLD: {profiles: ["MCX:GOLD", "MCX:GOLDM"], folder: GOLD}
  SILVER: {profiles: ["MCX:SILVERM"], folder: SILVER}
  RELIANCE: {profiles: ["NSE:RELIANCE"], folder: RELIANCE}
  HDFCBANK: {profiles: ["NSE:HDFCBANK"], folder: HDFCBANK}
  SBIN: {profiles: ["NSE:SBIN"], folder: SBIN}
  # The Mirror contract fixture's instrument (MCX_WIDGETOIL.yaml): a seeded synthetic series over
  # the fixture's days, so the fixture keeps working with no network and no data file.
  WIDGETOIL: {profiles: ["MCX:WIDGETOIL"], synthetic: {seed: 889, from: "2026-08-31", to: "2026-09-11", start: "5000"}}
# A share on NSE (NSE_EQUITY.yaml, symbol "*") is measured against its own bars: the stock is its
# own underlying, in a folder named after its symbol, laid out like any other (RELIANCE/2026/...).
# A stock's day is fetched only when a trader's trades need it. An entry above wins over this.
stocks: {profiles: ["NSE:*"], folder: "{symbol}"}
# Not mapped, deliberately: CME_ES (another vendor for one profile, out of scope). A profile with
# no entry answers "no series for this underlying".
