{#- Create your account: a login id and a password, nothing else (TICKET-914). The login
    id is also what we call him, so there is no separate name to ask for. -#}
<form method="post" action="/signup" id="door-form">
  <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
  <label class="field"><span class="field__label">Choose a login id</span><input class="field__input" name="login_id" type="text" autocomplete="username" required><span class="field__hint">Any name you like.</span></label>
  <label class="field"><span class="field__label">Password</span><input class="field__input" name="password" type="password" autocomplete="new-password" minlength="12" required><span class="field__hint">At least 12 characters. We don't ask for your email or phone, so we can't call or message you. It also means no reset link, so keep this password safe.</span></label>
  <div class="screen__actions">
    <button class="btn btn--primary btn--block" type="submit">Create account</button>
  </div>
  <p class="body-small">Next: a page on what we keep and why, then your file.</p>
</form>
