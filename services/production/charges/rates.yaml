# Statutory charges, dated (TICKET-911). Append-only: never edit a row; add one.
# A correction is a new row: a later effective_from, or the same effective_from with a later
# "added". rates.lock pins every row by digest. Rates are decimal fractions of the base, as strings.
#
# The table starts on 1 Oct 2024. Before that, exchange transaction charges were slabbed on each
# broker's monthly turnover and what a trader was billed was the broker's choice, so there is no
# single rate to state. SEBI's "true to label" circular (SEBI/HO/MRD/TPD-1/P/CIR/2024/92) made them
# flat and the same for every client from 1 Oct 2024. A trade before then refuses.
