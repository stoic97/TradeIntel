[build-system]
requires = ["setuptools>=68,<76"]
build-backend = "setuptools.build_meta"

[project]
name = "tradeintel"
version = "0.1.0"
description = "PlusEV TradeDNA research engine"
requires-python = "==3.11.*"
# Bounded ranges here; uv.lock carries the exact pins (ADR 004).
dependencies = [
  "pydantic>=2.6,<3",
  "pandas>=2.2,<3",
  "numpy>=1.26,<3",
  "pyarrow>=15,<25",
  "duckdb>=1.0,<2",
  "pyyaml>=6,<7",
]

[dependency-groups]
dev = [
  "pytest>=8,<9",
  "ruff>=0.5,<1",
  "mypy>=1.8,<2",
  "hypothesis>=6,<7",
]

[tool.setuptools.packages.find]
include = ["services*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
python_version = "3.11"
files = ["services/shared"]
strict = true
plugins = ["pydantic.mypy"]
